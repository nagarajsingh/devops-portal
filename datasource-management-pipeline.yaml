name: '$(Date:yyyyMMdd).$(Rev:r)-${{ parameters.environment }}-${{ parameters.application }}-${{ parameters.action }}'

trigger: none

variables:
  DATASOURCE_RUNTIME_API_URL: 'https://h2h-dev.mashreqdev.com/devops-portal/api'

parameters:
  - name: action
    type: string
    default: preview
    values:
      - preview
      - apply

  - name: requestId
    type: string

  - name: application
    type: string

  - name: environment
    type: string

  - name: instanceName
    type: string
    default: app1

  - name: agentPool
    type: string

  - name: adminHost
    type: string

  - name: adminPort
    type: string

  - name: sshPort
    type: string
    default: '22'

  - name: basePath
    type: string
    default: ''

  - name: domainName
    type: string

  - name: wlstPath
    type: string

  - name: sshUsername
    type: string

  - name: weblogicUsername
    type: string

  - name: referenceEntity
    type: string

  - name: targetEntity
    type: string

  - name: datasourceType
    type: string
    values:
      - standalone
      - gridlink

  - name: dbHost
    type: string

  - name: dbPort
    type: string

  - name: serviceId
    type: string

  - name: schemaUsername
    type: string

  - name: onsNodes
    type: string
    default: ''

jobs:
  - job: datasource_management
    displayName: '${{ parameters.action }} WebLogic datasources'
    pool:
      name: '${{ parameters.agentPool }}'

    steps:
      - checkout: self
        clean: true

      - bash: |
          set -euo pipefail
          command -v sshpass >/dev/null
          command -v ssh-keyscan >/dev/null
          command -v curl >/dev/null
          command -v python3 >/dev/null
          test -f backend/scripts/weblogic_datasource_manager.py
        displayName: 'Validate execution agent'

      - bash: |
          set -euo pipefail
          umask 077

          OUTPUT_DIR="$(Pipeline.Workspace)/datasource-output"
          LOCAL_RUNTIME="$(Pipeline.Workspace)/datasource-runtime.json"
          LOCAL_REQUEST="$(Pipeline.Workspace)/datasource-request.json"
          REMOTE_DIR="/tmp/devops-portal-ds-${P_REQUEST_ID}"
          mkdir -p "$OUTPUT_DIR"

          curl --fail --silent --show-error \
            --connect-timeout 30 \
            --max-time 60 \
            -H "X-Datasource-Pipeline-Token: $DATASOURCE_PIPELINE_API_TOKEN" \
            -H "Accept: application/json" \
            "$P_RUNTIME_API_URL/datasources/internal/runtime/$P_REQUEST_ID" \
            -o "$LOCAL_RUNTIME"

          python3 - <<'PY'
          import json, os

          request_id = os.environ['P_REQUEST_ID']
          with open(os.environ['LOCAL_RUNTIME']) as handle:
              payload = json.load(handle)

          if payload.get('request_id') != request_id:
              raise RuntimeError('Datasource runtime response request ID did not match')

          remote_payload = dict(payload)
          remote_payload.pop('ssh_password', None)
          with open(os.environ['LOCAL_REQUEST'], 'w') as handle:
              json.dump(remote_payload, handle)
          PY

          chmod 600 "$LOCAL_RUNTIME" "$LOCAL_REQUEST"
          SSH_PASSWORD="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["ssh_password"])' "$LOCAL_RUNTIME")"
          P_SSH_USERNAME="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["ssh_username"])' "$LOCAL_RUNTIME")"
          P_ADMIN_HOST="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["admin_host"])' "$LOCAL_RUNTIME")"
          P_SSH_PORT="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["ssh_port"])' "$LOCAL_RUNTIME")"
          P_WLST_PATH="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["wlst_path"])' "$LOCAL_RUNTIME")"

          KNOWN_HOSTS="$(Pipeline.Workspace)/datasource-known-hosts"
          rm -f "$KNOWN_HOSTS"
          ssh-keyscan -p "$P_SSH_PORT" "$P_ADMIN_HOST" > "$KNOWN_HOSTS" 2>/dev/null
          chmod 600 "$KNOWN_HOSTS"

          if [[ ! -s "$KNOWN_HOSTS" ]]; then
            echo "Unable to retrieve SSH host key for $P_ADMIN_HOST:$P_SSH_PORT"
            exit 1
          fi

          SSH_OPTS=(-p "$P_SSH_PORT" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN_HOSTS")
          SCP_OPTS=(-P "$P_SSH_PORT" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN_HOSTS")

          SSHPASS="$SSH_PASSWORD" sshpass -e ssh "${SSH_OPTS[@]}" "$P_SSH_USERNAME@$P_ADMIN_HOST" "mkdir -p '$REMOTE_DIR' && chmod 700 '$REMOTE_DIR'"
          SSHPASS="$SSH_PASSWORD" sshpass -e scp "${SCP_OPTS[@]}" "$LOCAL_REQUEST" backend/scripts/weblogic_datasource_manager.py "$P_SSH_USERNAME@$P_ADMIN_HOST:$REMOTE_DIR/"

          REMOTE_COMMAND=$(printf "%q %q %q %q" "$P_WLST_PATH" "$REMOTE_DIR/weblogic_datasource_manager.py" "$REMOTE_DIR/datasource-request.json" "$REMOTE_DIR/datasource-plan.json")
          REMOTE_COMMAND="$REMOTE_COMMAND $(printf "%q" "$P_ACTION")"

          set +e
          SSHPASS="$SSH_PASSWORD" sshpass -e ssh "${SSH_OPTS[@]}" "$P_SSH_USERNAME@$P_ADMIN_HOST" "$REMOTE_COMMAND"
          RC=$?
          set -e

          if [[ "$RC" -eq 0 ]]; then
            SSHPASS="$SSH_PASSWORD" sshpass -e scp "${SCP_OPTS[@]}" "$P_SSH_USERNAME@$P_ADMIN_HOST:$REMOTE_DIR/datasource-plan.json" "$OUTPUT_DIR/datasource-plan.json"
          fi

          SSHPASS="$SSH_PASSWORD" sshpass -e ssh "${SSH_OPTS[@]}" "$P_SSH_USERNAME@$P_ADMIN_HOST" "rm -rf '$REMOTE_DIR'" || true
          unset SSH_PASSWORD
          rm -f "$LOCAL_RUNTIME" "$LOCAL_REQUEST"

          if [[ "$RC" -ne 0 ]]; then
            echo "WLST datasource operation failed with exit code $RC"
            exit "$RC"
          fi

          python3 -m json.tool "$OUTPUT_DIR/datasource-plan.json" >/dev/null
          echo "Datasource $P_ACTION completed for request $P_REQUEST_ID."
        displayName: 'Run WLST datasource operation'
        env:
          LOCAL_RUNTIME: '$(Pipeline.Workspace)/datasource-runtime.json'
          LOCAL_REQUEST: '$(Pipeline.Workspace)/datasource-request.json'
          DATASOURCE_PIPELINE_API_TOKEN: '$(DATASOURCE_PIPELINE_API_TOKEN)'
          P_RUNTIME_API_URL: '$(DATASOURCE_RUNTIME_API_URL)'
          P_ACTION: '${{ parameters.action }}'
          P_REQUEST_ID: '${{ parameters.requestId }}'
      - task: PublishPipelineArtifact@1
        displayName: 'Publish datasource plan'
        inputs:
          targetPath: '$(Pipeline.Workspace)/datasource-output'
          artifact: 'datasource-plan'
          publishLocation: 'pipeline'
