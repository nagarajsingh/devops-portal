name: '$(Date:yyyyMMdd).$(Rev:r)-${{ parameters.environment }}-${{ parameters.application }}-${{ parameters.action }}'

trigger: none

parameters:
  - name: action
    type: string
    default: preview
    values:
      - preview
      - apply

  - name: requestId
    type: string

  - name: application
    type: string

  - name: environment
    type: string

  - name: instanceName
    type: string
    default: app1

  - name: agentPool
    type: string

  - name: adminHost
    type: string

  - name: adminPort
    type: string

  - name: sshPort
    type: string
    default: '22'

  - name: basePath
    type: string
    default: ''

  - name: domainName
    type: string

  - name: wlstPath
    type: string

  - name: sshUsername
    type: string

  - name: weblogicUsername
    type: string

  - name: operationMode
    type: string
    default: 'create'
    values:
      - create
      - update

  - name: datasourceName
    type: string
    default: ''

  - name: targetTargets
    type: string
    default: ''

  - name: referenceEntity
    type: string

  - name: targetEntity
    type: string

  - name: datasourceType
    type: string
    values:
      - standalone
      - gridlink

  - name: dbHost
    type: string

  - name: dbPort
    type: string

  - name: serviceId
    type: string

  - name: schemaUsername
    type: string

  - name: onsNodes
    type: string
    default: ''

jobs:
  - job: datasource_management
    displayName: '${{ parameters.action }} WebLogic datasources'
    pool:
      name: '${{ parameters.agentPool }}'

    steps:
      - checkout: self
        clean: true

      - bash: |
          set -euo pipefail
          command -v sshpass >/dev/null
          command -v ssh-keyscan >/dev/null
          command -v ansible-vault >/dev/null
          command -v python3 >/dev/null
          test -f backend/scripts/weblogic_datasource_manager.py
        displayName: 'Validate execution agent'

      - bash: |
          set -euo pipefail
          umask 077

          OUTPUT_DIR="$(Pipeline.Workspace)/datasource-output"
          LOCAL_RUNTIME="$(Pipeline.Workspace)/datasource-runtime.json"
          LOCAL_REQUEST="$(Pipeline.Workspace)/datasource-request.json"
          LOCAL_WLST_SCRIPT="$(Pipeline.Workspace)/weblogic_datasource_manager.py"
          VAULT_PASSWORD_FILE="$(Pipeline.Workspace)/datasource-vault-password"
          CONFIG_FILE="$(Build.SourcesDirectory)/datasource-config/${P_ENVIRONMENT,,}/${P_APPLICATION,,}.json.vault"
          REMOTE_DIR="/tmp/devops-portal-ds-${P_REQUEST_ID}"
          mkdir -p "$OUTPUT_DIR"

          echo "Pipeline source commit: $(git rev-parse HEAD 2>/dev/null || echo unknown)"
          sed '/^from __future__ import print_function$/d'             backend/scripts/weblogic_datasource_manager.py > "$LOCAL_WLST_SCRIPT"
          chmod 600 "$LOCAL_WLST_SCRIPT"

          echo "WLST script verification:"
          grep -n "from __future__ import print_function" "$LOCAL_WLST_SCRIPT" && {
            echo "Unexpected print_function future import still present."
            exit 1
          } || true
          grep -n 'connect(request\["weblogic_username"\]' "$LOCAL_WLST_SCRIPT" || true
          grep -n 'main()' "$LOCAL_WLST_SCRIPT" | tail -3 || true
          command -v sha256sum >/dev/null && sha256sum "$LOCAL_WLST_SCRIPT" || true

          if [[ -z "${ANSIBLE_VAULT_PASSWORD:-}" ]]; then
            echo "ANSIBLE_VAULT_PASSWORD is not configured."
            exit 1
          fi

          echo "ANSIBLE_VAULT_PASSWORD is available."

          if [[ ! -f "$CONFIG_FILE" ]]; then
            echo "Datasource config not found: $CONFIG_FILE"
            echo "Create and encrypt it with ansible-vault before running this pipeline."
            exit 1
          fi

          printf "%s" "$ANSIBLE_VAULT_PASSWORD" > "$VAULT_PASSWORD_FILE"
          chmod 600 "$VAULT_PASSWORD_FILE"
          ansible-vault view --vault-password-file "$VAULT_PASSWORD_FILE" "$CONFIG_FILE" > "$LOCAL_RUNTIME"
          chmod 600 "$LOCAL_RUNTIME"

          python3 - <<'PY'
          import json, os

          with open(os.environ['LOCAL_RUNTIME']) as handle:
              config = json.load(handle)

          application = os.environ['P_APPLICATION'].upper()
          environment = os.environ['P_ENVIRONMENT'].lower()
          target_entity = os.environ['P_TARGET_ENTITY'].upper()

          if str(config.get('application', '')).upper() != application:
              raise RuntimeError('Datasource config application does not match pipeline request')
          if str(config.get('environment', '')).lower() != environment:
              raise RuntimeError('Datasource config environment does not match pipeline request')

          password_pattern = os.environ.get('P_PASSWORD_PATTERN', '').strip()
          if not password_pattern:
              raise RuntimeError('Datasource password pattern was not supplied as a secret run variable')

          payload = {
              'request_id': os.environ['P_REQUEST_ID'],
              'application': application,
              'environment': environment,
              'instance_name': config.get('instance_name', 'app1'),
              'domain_name': config['domain_name'],
              'admin_host': config['admin_host'],
              'admin_port': int(config['admin_port']),
              'operation_mode': os.environ.get('P_OPERATION_MODE', 'create').lower(),
              'reference_entity': os.environ['P_REFERENCE_ENTITY'].upper(),
              'target_entity': target_entity,
              'datasource_name': os.environ.get('P_DATASOURCE_NAME', '').strip(),
              'target_targets': [
                  value.strip()
                  for value in os.environ.get('P_TARGET_TARGETS', '').split(',')
                  if value.strip()
              ],
              'datasource_type': os.environ['P_DATASOURCE_TYPE'].lower(),
              'db_host': os.environ['P_DB_HOST'],
              'db_port': int(os.environ['P_DB_PORT']),
              'service_id': os.environ['P_SERVICE_ID'],
              'schema_username': os.environ['P_SCHEMA_USERNAME'],
              'ons_nodes': os.environ.get('P_ONS_NODES', ''),
              'weblogic_username': config['weblogic_username'],
              'weblogic_password': config['weblogic_password'],
              'password_pattern': password_pattern,
          }

          with open(os.environ['LOCAL_REQUEST'], 'w') as handle:
              json.dump(payload, handle)
          PY

          chmod 600 "$LOCAL_REQUEST"
          SSH_PASSWORD="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["ssh_password"])' "$LOCAL_RUNTIME")"
          P_SSH_USERNAME="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["ssh_username"])' "$LOCAL_RUNTIME")"
          P_ADMIN_HOST="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["admin_host"])' "$LOCAL_RUNTIME")"
          P_SSH_PORT="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("ssh_port",22))' "$LOCAL_RUNTIME")"
          P_WLST_PATH="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["wlst_path"])' "$LOCAL_RUNTIME")"
          KNOWN_HOSTS="$(Pipeline.Workspace)/datasource-known-hosts"
          rm -f "$KNOWN_HOSTS"
          ssh-keyscan -p "$P_SSH_PORT" "$P_ADMIN_HOST" > "$KNOWN_HOSTS" 2>/dev/null
          chmod 600 "$KNOWN_HOSTS"

          if [[ ! -s "$KNOWN_HOSTS" ]]; then
            echo "Unable to retrieve SSH host key for $P_ADMIN_HOST:$P_SSH_PORT"
            exit 1
          fi

          SSH_OPTS=(-p "$P_SSH_PORT" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN_HOSTS")
          SCP_OPTS=(-P "$P_SSH_PORT" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN_HOSTS")

          SSHPASS="$SSH_PASSWORD" sshpass -e ssh "${SSH_OPTS[@]}" "$P_SSH_USERNAME@$P_ADMIN_HOST" "mkdir -p '$REMOTE_DIR' && chmod 700 '$REMOTE_DIR'"
          SSHPASS="$SSH_PASSWORD" sshpass -e scp "${SCP_OPTS[@]}" "$LOCAL_REQUEST" "$LOCAL_WLST_SCRIPT" "$P_SSH_USERNAME@$P_ADMIN_HOST:$REMOTE_DIR/"

          REMOTE_COMMAND=$(printf "%q %q %q %q" "$P_WLST_PATH" "$REMOTE_DIR/weblogic_datasource_manager.py" "$REMOTE_DIR/datasource-request.json" "$REMOTE_DIR/datasource-plan.json")
          REMOTE_COMMAND="$REMOTE_COMMAND $(printf "%q" "$P_ACTION")"

          set +e
          SSHPASS="$SSH_PASSWORD" sshpass -e ssh "${SSH_OPTS[@]}" "$P_SSH_USERNAME@$P_ADMIN_HOST" "$REMOTE_COMMAND"
          RC=$?
          set -e

          if [[ "$RC" -eq 0 ]]; then
            SSHPASS="$SSH_PASSWORD" sshpass -e scp "${SCP_OPTS[@]}" "$P_SSH_USERNAME@$P_ADMIN_HOST:$REMOTE_DIR/datasource-plan.json" "$OUTPUT_DIR/datasource-plan.json"
          fi

          SSHPASS="$SSH_PASSWORD" sshpass -e ssh "${SSH_OPTS[@]}" "$P_SSH_USERNAME@$P_ADMIN_HOST" "rm -rf '$REMOTE_DIR'" || true
          unset SSH_PASSWORD
          rm -f "$LOCAL_RUNTIME" "$LOCAL_REQUEST" "$LOCAL_WLST_SCRIPT" "$VAULT_PASSWORD_FILE"

          if [[ "$RC" -ne 0 ]]; then
            echo "WLST datasource operation failed with exit code $RC"
            exit "$RC"
          fi

          python3 -m json.tool "$OUTPUT_DIR/datasource-plan.json" >/dev/null

          # Emit a compact, non-secret copy of the plan into the build log so
          # the portal can retrieve it through dev.azure.com without depending
          # on the Azure artifact CDN endpoint.
          python3 - "$OUTPUT_DIR/datasource-plan.json" <<'PY'
          import base64
          import json
          import sys
          import zlib

          with open(sys.argv[1], "r") as handle:
              plan = json.load(handle)

          raw = json.dumps(plan, separators=(",", ":")).encode("utf-8")
          encoded = base64.b64encode(zlib.compress(raw, 9)).decode("ascii")
          print("DEVOPS_PORTAL_DATASOURCE_PLAN_ZLIB_B64=" + encoded)
          PY

          echo "Datasource $P_ACTION completed for request $P_REQUEST_ID."
        displayName: 'Run WLST datasource operation'
        env:
          LOCAL_RUNTIME: '$(Pipeline.Workspace)/datasource-runtime.json'
          LOCAL_REQUEST: '$(Pipeline.Workspace)/datasource-request.json'
          ANSIBLE_VAULT_PASSWORD: '$(ANSIBLE_VAULT_PASSWORD)'
          P_ACTION: '${{ parameters.action }}'
          P_REQUEST_ID: '${{ parameters.requestId }}'
          P_APPLICATION: '${{ parameters.application }}'
          P_ENVIRONMENT: '${{ parameters.environment }}'
          P_OPERATION_MODE: '${{ parameters.operationMode }}'
          P_DATASOURCE_NAME: '${{ parameters.datasourceName }}'
          P_TARGET_TARGETS: '${{ parameters.targetTargets }}'
          P_PASSWORD_PATTERN: '$(DS_PASSWORD_PATTERN)'
          P_REFERENCE_ENTITY: '${{ parameters.referenceEntity }}'
          P_TARGET_ENTITY: '${{ parameters.targetEntity }}'
          P_DATASOURCE_TYPE: '${{ parameters.datasourceType }}'
          P_DB_HOST: '${{ parameters.dbHost }}'
          P_DB_PORT: '${{ parameters.dbPort }}'
          P_SERVICE_ID: '${{ parameters.serviceId }}'
          P_SCHEMA_USERNAME: '${{ parameters.schemaUsername }}'
          P_ONS_NODES: '${{ parameters.onsNodes }}'
      - task: PublishPipelineArtifact@1
        displayName: 'Publish datasource plan'
        inputs:
          targetPath: '$(Pipeline.Workspace)/datasource-output'
          artifact: 'datasource-plan'
          publishLocation: 'pipeline'
