server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy";
    }

    # Ingress rewrites /devops-portal(/|$)(.*) to /$2.
    # Therefore child routes reach this container as /file-placement/*
    # and /ms-setup/*.

    location = /file-placement {
        return 301 /devops-portal/file-placement/;
    }

    # Streamlit is configured with:
    # server.baseUrlPath=devops-portal/file-placement
    # Re-add that prefix before forwarding to Streamlit.
    location ^~ /file-placement/ {
        proxy_pass http://file-placement-dashboard:8080/devops-portal/file-placement/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /devops-portal/file-placement;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
        proxy_redirect off;
    }

    location = /ms-setup {
        return 301 /devops-portal/ms-setup/;
    }

    # MS Setup is expected to be built for /devops-portal/ms-setup/.
    # Re-add that prefix before forwarding to the internal frontend service.
    location ^~ /ms-setup/ {
        proxy_pass http://ms-setup-frontend:8080/devops-portal/ms-setup/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /devops-portal/ms-setup;
        proxy_redirect off;
    }

    # Main DevOps Portal after ingress strips /devops-portal.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|woff|woff2|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss image/svg+xml;
}
