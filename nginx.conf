server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy";
    }

    location = /devops-portal {
        return 301 /devops-portal/;
    }

    location = /devops-portal/file-placement {
        return 301 /devops-portal/file-placement/;
    }

    # Streamlit frontend through the internal Kubernetes service.
    # The service exposes port 8080 and forwards to the Streamlit container.
    location ^~ /devops-portal/file-placement/ {
        proxy_pass http://file-placement-dashboard:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /devops-portal/file-placement;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
        proxy_redirect off;
    }

    location = /devops-portal/ms-setup {
        return 301 /devops-portal/ms-setup/;
    }

    location ^~ /devops-portal/ms-setup/ {
        proxy_pass http://ms-setup-frontend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /devops-portal/ms-setup;
        proxy_redirect off;
    }

    location /devops-portal/ {
        try_files $uri $uri/ /devops-portal/index.html;
    }

    location ~* ^/devops-portal/.*\.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|woff|woff2|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss image/svg+xml;
}
